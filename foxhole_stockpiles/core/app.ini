[OCR]
item_min_w=${OCR_ITEM_MIN_WIDTH@54}
item_max_w=${OCR_ITEM_MAX_WIDTH@58}
item_min_ratio=${OCR_ITEM_MIN_WH_RADIO@1.2}
item_max_ratio=${OCR_ITEM_MAX_WH_RADIO@1.4}
item_spacing_height=${OCR_ITEM_SPACING_HEIGHT@9}
item_spacing_width=${OCR_ITEM_SPACING_WIDTH@16}

[LOGGING]
level=${LOGGING_LOG_LEVEL@INFO}
loggers=${LOGGING_LOGGERS}
format=${LOGGING_LOG_FORMAT@[%(asctime)s] %(levelname)s [%(name)s] %(message)s}
date_format=${LOGGING_LOG_DATE_FORMAT@%Y-%m-%d %H:%M:%S}
file=${LOGGING_LOG_TO_FILE@0}

[BACKEND]
url=${BACKEND_URL}

[MODELS]
icons_path=${ICONS_PATH@models/icons_model}
quantities_path=${QUANTITIES_PATH@models/quantities_model}
catalog_items_path=${CATALOG_ITEMS_PATH@models/catalog_items.json}

[DEVELOPER]
detect_quantities=${DEVEL_QUANTITIES@1}
detect_icons=${DEVEL_ICONS@1}
detect_stockpile_type=${DEVEL_STOCKPILE_TYPE@1}
detect_stockpile_name=${DEVEL_STOCKPILE_NAME@1}
draw_rectangles=${DEVEL_DRAW_RECTANGLES@0}
save_images=${DEVEL_SAVE_IMAGES@0}
backup_path=${DEVEL_BACKUP_PATH@screenshots}
