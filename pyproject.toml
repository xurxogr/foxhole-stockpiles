[build-system]
requires = ["setuptools>=68.0", "wheel>=0.46.2"]
build-backend = "setuptools.build_meta"

[project]
name = "foxhole-stockpiles"
dynamic = ["version"]
description = "REST API for processing Foxhole game screenshots to extract stockpile information"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Jorge García", email = "jgroca@gmail.com"},
]
maintainers = [
    {name = "Jorge García", email = "jgroca@gmail.com"},
]
keywords = ["foxhole", "gaming", "ocr", "image-processing", "fastapi"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3 :: Only",
]
requires-python = ">=3.12"
dependencies = [
    # Core image processing libraries
    "httpx>=0.28.1",
    "numpy>=2.4.2",
    "opencv-python-headless>=4.13.0.90",
    "pillow>=12.1.1",
    "pydantic>=2.12.3",
    "pydantic_settings>=2.13.1",
    "pytesseract>=0.3.13",
    # HDF5 for database storage
    "h5py>=3.11.0",
    # Notifications
    "discord-webhook>=1.3.1",
    # FastAPI and web server
    "fastapi>=0.129.2",
    "uvicorn[standard]>=0.41.0",
    "python-multipart>=0.0.22",
    "jinja2>=3.1.0",
    "slowapi>=0.1.9",
    # Memory profiling
    "psutil>=7.2.2",
    "memory-profiler>=0.61.0",
    # PyQt6 for GUI
    "PyQt6>=6.10.2",
]

[project.optional-dependencies]
dev = [
    # Testing
    "pytest>=9.0.2",
    "pytest-asyncio>=1.2.0",
    "pytest-cov>=7.0.0",
    "pytest-xdist>=3.8.0",
    "pytest-qt>=4.5.0",

    # Code Quality & Formatting (dev-only)
    "mypy>=1.19.1",
    "ruff>=0.15.2",
    "pre-commit>=4.5.1",
    "types-requests",
    "types-psutil",
    "h5py-stubs",

    # Developer Tools
    "PyQt6>=6.10.2",
]

[project.urls]
Homepage = "https://github.com/xurxogr/foxhole-stockpiles"
Repository = "https://github.com/xurxogr/foxhole-stockpiles"

[tool.setuptools.dynamic]
version = {attr = "foxhole_stockpiles.__version__"}

[tool.setuptools.packages.find]
include = ["foxhole_stockpiles*"]

# Remove package-dir since we're using flat layout
[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = "pytesseract.*"
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pyright]
stubPath = "stubs"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
preview = true
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "D",   # pydocstyle (docstring checks)
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
# Use loadfile distribution for better coverage combining
addopts = "-n auto --dist=loadfile --cov=foxhole_stockpiles --cov-report=term-missing"
filterwarnings = [
    "ignore::RuntimeWarning",
]

[tool.coverage.run]
source = ["foxhole_stockpiles"]
parallel = true
branch = true

[tool.coverage.report]
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
]

[tool.coverage.html]
directory = "htmlcov"

[project.scripts]
fs = "foxhole_stockpiles.commands.fs.fs:main"

[project.gui-scripts]
fs-gui = "foxhole_stockpiles.gui.app:launch_gui"
