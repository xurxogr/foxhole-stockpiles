[build-system]
requires = ["setuptools>=84.2.1", "wheel>=0.48.0"]
build-backend = "setuptools.build_meta"

[project]
name = "foxhole-stockpiles"
dynamic = ["version"]
description = "Capture-first desktop app for extracting stockpile data from Foxhole screenshots and .sav files"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Jorge García", email = "jgroca@gmail.com"},
]
maintainers = [
    {name = "Jorge García", email = "jgroca@gmail.com"},
]
keywords = ["foxhole", "gaming", "ocr", "image-processing", "stockpile"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3 :: Only",
]
requires-python = ">=3.12"
dependencies = [
    # Core image processing libraries
    "httpx>=0.28.1",
    "numpy>=2.5.4",
    "pillow>=13.0.0",
    "pydantic>=2.14.3",
    "pydantic_settings>=2.16.2",
    # Platform-appropriate config directory resolution
    "platformdirs>=4.14.5",
    # Clipboard access (shared by GUI and CLI clipboard scanning)
    "pyperclip>=1.11.0",
    # Google API
    "google-api-python-client>=2.201.0",
    "google-auth-httplib2>=0.4.4",
    "httplib2>=0.32.1",
    "google-auth-oauthlib>=1.5.0",
    # PySide6 for GUI (LGPL, official Qt project)
    "PySide6>=6.12.0",
    # CLI framework for fs-ocr
    "typer>=0.28.0",
    # SAV file parsing (Rust implementation)
    "fs-sav>=0.4.1",
    # OCR engine (Rust implementation)
    "fs-ocr>=1.1.0",
    # Game asset tools: catalog and icon-template database (Rust implementation)
    "fs-assets>=0.5.0",
]

[project.optional-dependencies]
dev = [
    # Testing
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
    "pytest-cov>=7.1.0",
    "pytest-xdist>=3.8.0",
    "pytest-qt>=4.5.0",

    # Code Quality & Formatting (dev-only)
    "mypy>=2.4.1",
    "ruff>=0.17.4",
    "pre-commit>=4.7.0",

]
# Packaging the standalone executables.
build = [
    "pyinstaller>=6.22.3",
]
# Screenshot capture and global hotkeys (Windows only): game window lookup and
# the hotkey listener. Without them both features are disabled.
capture = [
    "pywinctl>=0.4.1; sys_platform == 'win32'",
    "pynput>=1.8.2; sys_platform == 'win32'",
]

[project.urls]
Homepage = "https://github.com/xurxogr/foxhole-stockpiles"
Repository = "https://github.com/xurxogr/foxhole-stockpiles"

[tool.setuptools.dynamic]
version = {attr = "foxhole_stockpiles.__version__"}

[tool.setuptools.packages.find]
include = ["foxhole_stockpiles*", "fs_tools*"]
exclude = ["fs_tools.tests*"]

# Remove package-dir since we're using flat layout
[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = [
    "google_auth_oauthlib.*",
    "googleapiclient.*",
    "httplib2.*",
    "pynput.*",
    "pywinctl.*",
    "pyperclip.*",
]
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pyright]
stubPath = "stubs"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
preview = true
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "D",   # pydocstyle (docstring checks)
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.flake8-bugbear]
# Typer relies on calling Option/Argument in parameter defaults; these are
# effectively immutable sentinels, so B008 should not flag them.
extend-immutable-calls = ["typer.Option", "typer.Argument"]

[tool.pytest.ini_options]
testpaths = ["tests", "fs_tools/tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
qt_api = "pyside6"
addopts = "-n auto --dist=loadfile --cov=foxhole_stockpiles --cov=fs_tools --cov-report=term-missing"
filterwarnings = [
    "ignore::RuntimeWarning",
    "ignore::DeprecationWarning:foxhole_stockpiles.gui",
]

[tool.coverage.run]
source = ["foxhole_stockpiles", "fs_tools"]
parallel = true
branch = true

[tool.coverage.report]
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
]

[tool.coverage.html]
directory = "htmlcov"

[project.scripts]
fs = "foxhole_stockpiles.cli.app:main"
fs-tools = "fs_tools.cli:main"

[project.gui-scripts]
fs-gui = "foxhole_stockpiles.gui.app:launch_gui"
fs-tools-gui = "fs_tools.gui:run_gui"
