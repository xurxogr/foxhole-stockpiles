[build-system]
requires = ["setuptools>=68.0", "wheel>=0.46.2"]
build-backend = "setuptools.build_meta"

[project]
name = "foxhole-stockpiles"
dynamic = ["version"]
description = "REST API for processing Foxhole game screenshots to extract stockpile information"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Jorge García", email = "jgroca@gmail.com"},
]
maintainers = [
    {name = "Jorge García", email = "jgroca@gmail.com"},
]
keywords = ["foxhole", "gaming", "ocr", "image-processing", "fastapi"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3 :: Only",
]
requires-python = ">=3.12"
dependencies = [
    # Core image processing libraries
    "httpx>=0.28.1",
    "numpy>=2.4.5",
    "opencv-python-headless>=4.13.0.90",
    "pillow>=12.2.0",
    "pydantic>=2.13.4",
    "pydantic_settings>=2.14.1",
    "pytesseract>=0.3.13",
    # HDF5 for database storage
    "h5py>=3.16.0",
    # Notifications
    "discord-webhook>=1.3.1",
    # FastAPI and web server
    "fastapi>=0.136.1",
    "uvicorn[standard]>=0.47.0",
    "python-multipart>=0.0.29",
    "jinja2>=3.1.0",
    "slowapi>=0.1.9",
    # Memory profiling
    "psutil>=7.2.2",
    "memory-profiler>=0.61.0",
    # Google API
    "google-api-python-client>=2.196.0",
    "google-auth-httplib2>=0.4.0",
    "google-auth-oauthlib>=1.4.0"
    # PySide6 for GUI (LGPL, official Qt project)
    "PySide6>=6.6",
    # CLI framework for fs-ocr
    "typer>=0.12.0",
    # SAV file parsing (Rust implementation)
    "fs-sav>=0.2.0",
]

[project.optional-dependencies]
dev = [
    # Testing
    "pytest>=9.0.3",
    "pytest-asyncio>=1.2.0",
    "pytest-cov>=7.1.0",
    "pytest-xdist>=3.8.0",
    "pytest-qt>=4.5.0",

    # Code Quality & Formatting (dev-only)
    "mypy>=2.1.0",
    "ruff>=0.15.13",
    "pre-commit>=4.6.0",
    "types-requests",
    "types-psutil",
    "h5py-stubs",

]

[project.urls]
Homepage = "https://github.com/xurxogr/foxhole-stockpiles"
Repository = "https://github.com/xurxogr/foxhole-stockpiles"

[tool.setuptools.dynamic]
version = {attr = "foxhole_stockpiles.__version__"}

[tool.setuptools.packages.find]
include = ["foxhole_stockpiles*", "fs_ocr*", "fs_tools*"]
exclude = ["fs_tools.tests*"]

# Remove package-dir since we're using flat layout
[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["pytesseract.*", "google_auth_oauthlib.*", "googleapiclient.*"]
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pyright]
stubPath = "stubs"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
preview = true
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "D",   # pydocstyle (docstring checks)
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.flake8-bugbear]
# Typer relies on calling Option/Argument in parameter defaults; these are
# effectively immutable sentinels, so B008 should not flag them.
extend-immutable-calls = ["typer.Option", "typer.Argument"]

[tool.pytest.ini_options]
testpaths = ["tests", "fs_ocr/tests", "fs_tools/tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
qt_api = "pyside6"
addopts = "-n auto --dist=loadfile --cov=foxhole_stockpiles --cov=fs_ocr --cov-report=term-missing"
filterwarnings = [
    "ignore::RuntimeWarning",
    "ignore::DeprecationWarning:foxhole_stockpiles.gui",
]

[tool.coverage.run]
source = ["foxhole_stockpiles", "fs_ocr"]
parallel = true
branch = true

[tool.coverage.report]
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
]

[tool.coverage.html]
directory = "htmlcov"

[project.scripts]
fs = "foxhole_stockpiles.cli.app:main"
fs-ocr = "fs_ocr.cli:main"
fs-tools = "fs_tools.cli:main"

[project.gui-scripts]
fs-gui = "foxhole_stockpiles.gui.app:launch_gui"
fs-tools-gui = "fs_tools.gui:run_gui"
