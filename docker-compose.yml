services:
  foxhole_stockpiles:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: foxhole_stockpiles:latest
    container_name: foxhole_stockpiles
    restart: unless-stopped
    ports:
    - 8010:8010
    env_file:
    - .env
    volumes:
    - ./config:/code/config
    - ./logs:/code/logs
    - ./models:/code/models
    - ./screenshots:/code/screenshots
    - ./tessdata/custom.traineddata:/usr/share/tesseract-ocr/5/tessdata/custom.traineddata
    - ./tessdata/rennernumbers.traineddata:/usr/share/tesseract-ocr/5/tessdata/rennernumbers.traineddata
