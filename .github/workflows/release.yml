name: Release

# Tag a commit `vX.Y.Z` to build the standalone Windows executables and publish
# them as assets on a GitHub Release. Unlike the sibling fs-ocr / fs-sav repos
# (Rust wheels to PyPI), this app ships PyInstaller .exe artifacts.

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

jobs:
  release:
    name: Build and publish Windows executables
    timeout-minutes: 30
    runs-on: windows-latest
    permissions:
      contents: write  # needed to create the release and upload assets
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'

      - name: Set up uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7

      - name: Install the locked dependencies
        run: uv sync --frozen --extra capture --extra build

      - name: Build executables
        run: uv run --frozen python build_fs.py

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          generate_release_notes: true
          files: |
            dist/fs.exe
            dist/fs-tools.exe
