name: Release

# Tag a commit `vX.Y.Z` to build the standalone Windows executables and publish
# them as assets on a GitHub Release. Unlike the sibling fs-ocr / fs-sav repos
# (Rust wheels to PyPI), this app ships PyInstaller .exe artifacts.

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

jobs:
  ci:
    name: Lint, test and build
    uses: ./.github/workflows/ci.yml
    secrets: inherit

  release:
    name: Build and publish Windows executables
    needs: ci
    timeout-minutes: 30
    runs-on: windows-latest
    permissions:
      contents: write  # needed to create the release and upload assets
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: Install the locked dependencies
        run: uv sync --frozen --extra capture --extra build

      - name: Build executables
        run: uv run --frozen python build_fs.py

      - name: Create GitHub Release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3
        with:
          generate_release_notes: true
          files: |
            dist/fs.exe
            dist/fs-tools.exe
