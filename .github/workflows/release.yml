name: Release

# Tag a commit `vX.Y.Z` to build the standalone Windows executables and publish
# them as assets on a GitHub Release. Unlike the sibling fs-ocr / fs-sav repos
# (Rust wheels to PyPI), this app ships PyInstaller .exe artifacts.

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

jobs:
  release:
    name: Build and publish Windows executables
    runs-on: windows-latest
    permissions:
      contents: write  # needed to create the release and upload assets
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pyinstaller

      - name: Build executables
        run: python build_fs.py

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: |
            dist/fs.exe
            dist/fs-tools.exe
